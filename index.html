<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#112c2c"><title>林地远征 3D · 林心回响</title><link rel="stylesheet" href="style.css?v=4"></head><body>
<canvas id="world" aria-label="3D 战斗场景"></canvas><div id="vignette"></div><div id="damage-edge"></div>
<header><a class="brand" href="#" aria-label="林地远征">FOREST <span> / </span> ECHOES <small>林地远征 · 3D</small></a><div class="top-actions"><button id="sound" aria-label="切换声音">声音：开</button><details id="audio-settings"><summary>音量</summary><div class="audio-panel"><label for="music-volume">背景音乐 <output id="music-value">65%</output></label><input id="music-volume" type="range" min="0" max="100" value="65"><label for="sfx-volume">战斗音效 <output id="sfx-value">80%</output></label><input id="sfx-volume" type="range" min="0" max="100" value="80"><small>首次点“踏入荒野”开启声音</small></div></details><button id="pause">暂停 <kbd>ESC</kbd></button></div></header>
<main id="menu"><div class="intro"><p class="eyebrow">一场新的远征 · 立体世界</p><h1>循光而行<br><em>深入林心</em></h1><p class="lead">在古木、霜雪与余烬之间，<br>选择你的武器，迎战苏醒的荒野。</p><div class="hero-options"><button data-hero="scout">林地游侠<small>战术翻滚 / 枪械与火焰</small></button><button data-hero="silver" class="selected">霜影<small>白发面具 / 暗影瞬移</small></button></div><div id="weapons"></div><p id="weapon-preview"></p><div class="map-options"><button data-map="forest" class="selected">01 翡翠幽林</button><button data-map="snow">02 霜月峡谷</button><button data-map="ash">03 赤烬荒原</button></div><button id="start" class="primary" disabled>踏入荒野 <span>↗</span></button><p class="help">电脑 WASD / 方向键移动 · Shift 闪避 · 自动攻击<br>手机摇杆移动 · 建议横屏游玩</p></div><div class="menu-caption"><span>霜影 / SILVER VEIL</span><small>猎手与游侠 · 全新 3D 旅程</small></div></main>
<section id="hud" hidden><div class="status"><span id="hero-name">霜影</span><span id="level">Lv.1</span><div class="hp"><i></i><b></b></div><div class="xp-meta"><span>经验 <b id="xp-next">→ Lv.2</b></span><strong id="xp-value">0 / 20</strong></div><div class="xp" role="progressbar" aria-label="升级经验" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><i></i></div><span id="xp-gain"></span></div><div class="run-info"><strong id="timer">00:00</strong><small id="kills">击败 0</small></div><div id="objective">探索补给与祭坛</div><div id="boss-hud" hidden><span>林心守卫</span><i></i></div><aside id="map"><canvas width="144" height="144"></canvas><span>区域探索</span></aside><div id="skills"></div><div id="hint">移动迎战 · 收集灵光升级</div></section>
<div id="asset-loading" role="status"><span>正在准备人物与动作 · 首次加载需要联网</span><button id="asset-retry" hidden>重新加载</button></div><div id="toast" role="status"></div><section id="touch" hidden><div id="joystick"><i></i></div><button id="dash">瞬移</button></section>
<dialog id="dialog"><div id="dialog-content"></div></dialog><div id="error" hidden></div><script type="module" src="main.js?v=4"></script></body></html>
