<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>怪物实际步行与扑击回归</title>
<style>body{margin:18px;background:#18231f;color:#e4e9df;font:15px system-ui}h1{font-size:23px}button,select{padding:9px;margin:4px}pre{max-height:350px;overflow:auto;white-space:pre-wrap;background:#111a16;padding:12px}#view iframe{width:1280px;height:720px;border:0;position:absolute;left:-1400px;top:0}#capture{max-width:100%;width:1280px;display:block}#status{color:#cbd6af}</style>
<h1>真实游戏：怪物落脚、转向与扑击</h1>

<button id="run">运行完整回归</button><select id="kind"><option value="wolf">狼</option><option value="mushroom">蘑菇</option></select>
